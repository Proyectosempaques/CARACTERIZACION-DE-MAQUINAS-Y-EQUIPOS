<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caracterización de Equipos — Carvajal Empaques</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --carvajal-naranja: #EB6608;
      --carvajal-verde: #00A859;
      --carvajal-violeta: #3A1B57;
      --bg-body: #F4F6F8;
      --card-bg: #FFFFFF;
      --texto-principal: #0F172A;
      --texto-secundario: #475569;
      --borde: #E2E8F0;
      --radius: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg-body); color: var(--texto-principal); padding-bottom: 40px; }
    header {
      background: var(--carvajal-violeta); color: #fff; padding: 16px 30px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 4px solid var(--carvajal-naranja);
    }
    .header-info h1 { font-family: 'Oswald', sans-serif; font-size: 1.6rem; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; }
    .header-info p { font-size: 0.8rem; color: #CBD5E1; }
    .logo-container img { height: 40px; width: auto; display: block; }
    .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--card-bg); padding: 10px 15px; border-radius: var(--radius); border: 1px solid var(--borde); text-align: center; border-top: 3px solid var(--carvajal-violeta); }
    .kpi-num { font-family: 'Oswald', sans-serif; font-size: 1.5rem; color: var(--carvajal-violeta); font-weight: 700; }
    .kpi-label { font-size: 0.7rem; text-transform: uppercase; color: var(--texto-secundario); font-weight: 600; margin-top: 2px; }
    .controls-panel { background: var(--card-bg); padding: 12px 18px; border-radius: var(--radius); border: 1px solid var(--borde); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
    .search-input { flex: 1; min-width: 220px; padding: 8px 12px; border: 1px solid var(--borde); border-radius: 4px; font-size: 0.85rem; outline: none; }
    .search-input:focus { border-color: var(--carvajal-violeta); }
    .filter-select { padding: 8px 10px; border: 1px solid var(--borde); border-radius: 4px; font-size: 0.82rem; background-color: #fff; color: var(--texto-principal); outline: none; }
    .btn-clear { padding: 8px 14px; background: #E2E8F0; color: #475569; border: none; border-radius: 4px; font-weight: 600; font-size: 0.82rem; cursor: pointer; }
    .btn-clear:hover { background: #CBD5E1; }
    .equipos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .equipo-card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--borde); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
    .equipo-card:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); border-color: var(--carvajal-violeta); }
    .card-header-tag { background: var(--carvajal-violeta); color: #fff; padding: 8px 12px; font-family: 'Oswald', sans-serif; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--carvajal-naranja); }
    .card-header-tag .codigo { font-size: 1rem; color: #fff; }
    .card-header-tag .tipo { font-size: 0.72rem; text-transform: uppercase; color: #E2E8F0; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; }
    .img-container { height: 160px; background: #FAFCFF; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid var(--borde); }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
    .no-foto { font-size: 0.75rem; color: #94A3B8; font-style: italic; }
    .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .equipo-nombre { font-size: 0.88rem; font-weight: 700; margin-bottom: 10px; color: var(--texto-principal); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.75rem; color: var(--texto-secundario); margin-bottom: 10px; }
    .specs-item span { display: block; color: var(--texto-principal); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badges-container { display: flex; flex-wrap: wrap; gap: 4px; }
    .badge { font-size: 0.65rem; font-weight: 700; padding: 3px 6px; border-radius: 3px; text-transform: uppercase; }
    .badge-planta { background: #E0F2FE; color: #0369A1; }
    .badge-estado { background: #DCFCE7; color: #15803D; border: 1px solid #86EFAC; }
    .badge-estado-inactivo { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
    .badge-voltaje { background: #FEF3C7; color: #B45309; }
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(3px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; opacity: 0; visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease; padding: 15px;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content { background: #fff; width: 100%; max-width: 920px; max-height: 90vh; border-radius: 8px; overflow: hidden; box-shadow: 0 15px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
    .modal-header { background: var(--carvajal-violeta); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--carvajal-naranja); }
    .modal-header-titles h2 { font-family: 'Oswald', sans-serif; font-size: 1.4rem; text-transform: uppercase; color: #fff; }
    .modal-header-titles p { font-size: 0.85rem; color: #CBD5E1; font-weight: 400; }
    .modal-close { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
